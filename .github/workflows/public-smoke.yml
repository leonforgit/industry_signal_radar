name: Public smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Run public smoke tests
        run: |
          python scripts/smoke_test_radar_candidate_pool.py
          python scripts/smoke_test_radar_upstream_bridge.py
          python scripts/smoke_test_radar_harness_v2.py
          python scripts/smoke_test_radar_news_verification_sidecar.py
          python scripts/smoke_test_shared_news_overlay.py
          python scripts/check_radar_contract_cases.py
